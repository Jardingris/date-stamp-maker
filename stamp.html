<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>日付印メーカー</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #d00000;
      --text: #202124;
      --muted: #62656a;
      --line: #d8dadd;
      --panel: #ffffff;
      --page: #f4f5f7;
      --focus: #2459d3;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--text);
      background: var(--page);
    }

    main {
      width: min(980px, calc(100% - 32px));
      margin: 0 auto;
      padding: 48px 0;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(24px, 4vw, 34px);
      letter-spacing: .04em;
    }

    .lead {
      margin: 0 0 28px;
      color: var(--muted);
      line-height: 1.7;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(280px, 360px) minmax(300px, 1fr);
      gap: 24px;
      align-items: start;
    }

    .panel {
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--panel);
      box-shadow: 0 8px 28px rgba(24, 28, 35, .06);
    }

    .field + .field { margin-top: 18px; }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: 700;
    }

    input {
      width: 100%;
      min-height: 44px;
      padding: 9px 12px;
      border: 1px solid #aeb2b8;
      border-radius: 8px;
      color: var(--text);
      background: #fff;
      font: inherit;
      font-size: 16px;
    }

    .checkbox-option {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 12px 0 0;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .checkbox-option input {
      flex: 0 0 auto;
      width: 18px;
      min-height: 18px;
      height: 18px;
      padding: 0;
      accent-color: var(--ink);
    }

    .size-field {
      margin: 18px 0 0;
      padding: 0;
      border: 0;
    }

    .size-field legend {
      padding: 0;
      font-size: 14px;
      font-weight: 700;
    }

    .size-options {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 8px;
    }

    .size-option {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 44px;
      margin: 0;
      padding: 8px;
      border: 1px solid #aeb2b8;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
    }

    .size-option:has(input:checked) {
      border-color: var(--ink);
      color: var(--ink);
      background: color-mix(in srgb, var(--ink) 6%, #fff);
    }

    .size-option input {
      flex: 0 0 auto;
      width: 18px;
      min-height: 18px;
      height: 18px;
      padding: 0;
      accent-color: var(--ink);
    }

    input:focus-visible,
    button:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--focus) 32%, transparent);
      outline-offset: 2px;
    }

    .actions {
      display: grid;
      gap: 10px;
      margin-top: 24px;
    }

    button {
      min-height: 44px;
      padding: 10px 16px;
      border: 1px solid #aeb2b8;
      border-radius: 9px;
      color: var(--text);
      background: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button.primary {
      border-color: var(--ink);
      color: #fff;
      background: var(--ink);
    }

    button:hover:not(:disabled) { filter: brightness(.96); }

    button:disabled {
      cursor: not-allowed;
      opacity: .48;
    }

    #status {
      min-height: 48px;
      margin: 16px 0 0;
      padding: 11px 12px;
      border-radius: 8px;
      color: var(--muted);
      background: #f4f5f7;
      font-size: 14px;
      line-height: 1.6;
    }

    #status[data-state="success"] {
      color: #155c35;
      background: #e8f5ed;
    }

    #status[data-state="error"] {
      color: #9e1b1b;
      background: #fff0f0;
    }

    .preview-heading {
      margin: 0 0 14px;
      font-size: 16px;
    }

    .preview-wrap {
      display: grid;
      place-items: center;
      aspect-ratio: 1;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 12px;
      background-color: #fff;
      background-image:
        linear-gradient(45deg, #eceef1 25%, transparent 25%),
        linear-gradient(-45deg, #eceef1 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #eceef1 75%),
        linear-gradient(-45deg, transparent 75%, #eceef1 75%);
      background-position: 0 0, 0 12px, 12px -12px, -12px 0;
      background-size: 24px 24px;
    }

    #stamp-preview {
      width: min(100%, 500px);
      aspect-ratio: 1;
      padding: 5%;
    }

    #stamp-preview svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .preview-note {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .verifier-panel {
      margin-top: 24px;
    }

    .verifier-panel h2 {
      margin: 0 0 8px;
      font-size: 20px;
    }

    #verify-status {
      margin: 16px 0 0;
      padding: 11px 12px;
      border-radius: 8px;
      background: #f4f5f7;
      font-size: 14px;
      line-height: 1.6;
    }

    #verify-status[data-state="verified"] {
      color: #155c35;
      background: #e8f5ed;
    }

    #verify-status[data-state="modified"],
    #verify-status[data-state="error"] {
      color: #9e1b1b;
      background: #fff0f0;
    }

    .verify-details {
      display: grid;
      grid-template-columns: max-content minmax(0, 1fr);
      gap: 8px 18px;
      margin: 16px 0 0;
      font-size: 14px;
    }

    .verify-details dt { font-weight: 700; }
    .verify-details dd {
      min-width: 0;
      margin: 0;
      overflow-wrap: anywhere;
    }

    @media (max-width: 760px) {
      main { padding: 28px 0; }
      .workspace { grid-template-columns: 1fr; }
      .preview-panel { order: -1; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <main>
    <h1>日付印メーカー</h1>
    <p class="lead">名前と日付を入力し、背景が透明な日付印をコピーまたは保存します。</p>

    <div class="workspace">
      <section class="panel" aria-label="日付印の設定">
        <div class="field">
          <label for="top-name">上段</label>
          <input id="top-name" type="text" inputmode="text" autocomplete="off"
                 placeholder="上段（任意）" aria-describedby="name-help">
        </div>
        <div class="field">
          <label for="bottom-name">下段</label>
          <input id="bottom-name" type="text" inputmode="text" autocomplete="off"
                 placeholder="下段（任意）" aria-describedby="name-help">
        </div>
        <p id="name-help" class="preview-note">各欄は4文字以内です。両方とも空欄にできます。</p>
        <div class="field">
          <label for="stamp-date">日付</label>
          <input id="stamp-date" type="date" required>
          <label class="checkbox-option" for="short-year">
            <input id="short-year" type="checkbox">
            <span>年を2桁で表示（2026 → '26）</span>
          </label>
        </div>

        <fieldset class="size-field" aria-describedby="size-help">
          <legend>PNGサイズ</legend>
          <div class="size-options">
            <label class="size-option"><input id="output-small" name="output-size" type="radio" value="256" checked>小</label>
            <label class="size-option"><input id="output-medium" name="output-size" type="radio" value="512">中</label>
            <label class="size-option"><input id="output-large" name="output-size" type="radio" value="1024">大</label>
          </div>
          <p id="size-help" class="preview-note">通常の使用では「小」が適しています。貼り付け後、用途に合わせてサイズを調整してください。</p>
        </fieldset>

        <div class="actions">
          <button id="copy-png" class="primary" type="button" disabled>透過PNGをコピー</button>
          <button id="download-png" type="button" disabled>PNGを保存</button>
          <button id="download-svg" type="button" disabled>SVGを保存</button>
        </div>
        <p id="status" role="status" aria-live="polite" data-state="working">画像を準備しています。</p>
      </section>

      <section class="panel preview-panel" aria-labelledby="preview-title">
        <h2 id="preview-title" class="preview-heading">プレビュー</h2>
        <div class="preview-wrap">
          <div id="stamp-preview"></div>
        </div>
        <p class="preview-note">格子模様は透明部分の確認用で、保存画像には入りません。</p>
      </section>
    </div>

    <section id="provenance-verifier" class="panel verifier-panel" aria-labelledby="verify-title" hidden>
      <h2 id="verify-title">画像の来歴を確認</h2>
      <p class="lead">このツールで作成されたPNGまたはSVGを選択してください。</p>
      <label for="verify-file">画像ファイル</label>
      <input id="verify-file" type="file" accept="image/png,image/svg+xml,.png,.svg">
      <p id="verify-status" role="status" aria-live="polite" data-state="idle">画像を選択してください。</p>
      <dl id="verify-details" class="verify-details"></dl>
    </section>
  </main>

  <script>
    (() => {
      "use strict";

      const INK = "#D00000";
      const NAME_FONT_FAMILY = "'BIZ UDMincho Medium', 'BIZ UDMincho', 'BIZ UD明朝 Medium', 'Hiragino Mincho ProN', 'MS Mincho', 'Noto Serif CJK JP', serif";
      const DATE_FONT_FAMILY = "'BIZ UDPMincho Medium', 'BIZ UDPMincho', 'BIZ UDP明朝 Medium', 'Hiragino Mincho ProN', 'MS PMincho', 'Noto Serif CJK JP', serif";
      const MAX_NAME_LENGTH = 4;
      const PROVENANCE_SCHEMA = "org.jardingris.date-stamp-maker.provenance";
      const PROVENANCE_VERSION = 1;
      const PROVENANCE_ISSUER_ID = "6dce9d5b-ddd2-4121-b179-c8e6a861c061";
      const PROVENANCE_KEYWORD = "DateStampMaker";
      const PIXEL_WATERMARK_MAGIC = new Uint8Array([68, 83, 77, 49]);
      const MAX_PROVENANCE_BYTES = 65535;
      const MAX_VERIFY_FILE_SIZE = 20 * 1024 * 1024;
      const MAX_VERIFY_SVG_SIZE = 2 * 1024 * 1024;
      const MAX_VERIFY_PNG_DIMENSION = 2048;
      const MAX_VERIFY_PNG_PIXELS = 2048 * 2048;
      const PNG_SIGNATURE = new Uint8Array([137, 80, 78, 71, 13, 10, 26, 10]);
      const textEncoder = new TextEncoder();
      const textDecoder = new TextDecoder();
      const strictTextDecoder = new TextDecoder("utf-8", { fatal: true });
      const elements = {
        topName: document.querySelector("#top-name"),
        bottomName: document.querySelector("#bottom-name"),
        date: document.querySelector("#stamp-date"),
        shortYear: document.querySelector("#short-year"),
        outputSizes: document.querySelectorAll('input[name="output-size"]'),
        preview: document.querySelector("#stamp-preview"),
        copyPng: document.querySelector("#copy-png"),
        downloadPng: document.querySelector("#download-png"),
        downloadSvg: document.querySelector("#download-svg"),
        status: document.querySelector("#status"),
        verifier: document.querySelector("#provenance-verifier"),
        verifyFile: document.querySelector("#verify-file"),
        verifyStatus: document.querySelector("#verify-status"),
        verifyDetails: document.querySelector("#verify-details")
      };

      let currentSvg = "";
      let currentPngBlob = null;
      let currentConfig = null;
      let renderGeneration = 0;
      let verificationGeneration = 0;
      const measureCanvas = document.createElement("canvas");
      const measureContext = measureCanvas.getContext("2d");
      const graphemeSegmenter = typeof Intl.Segmenter === "function"
        ? new Intl.Segmenter("ja", { granularity: "grapheme" })
        : null;

      function getLocalDateValue() {
        const now = new Date();
        const year = String(now.getFullYear()).padStart(4, "0");
        const month = String(now.getMonth() + 1).padStart(2, "0");
        const day = String(now.getDate()).padStart(2, "0");
        return `${year}-${month}-${day}`;
      }

      function graphemeLength(value) {
        if (graphemeSegmenter) return Array.from(graphemeSegmenter.segment(value)).length;
        return Array.from(value.normalize("NFC")).length;
      }

      function readStampConfig() {
        return {
          topName: elements.topName.value.trim(),
          bottomName: elements.bottomName.value.trim(),
          date: elements.date.value,
          shortYear: elements.shortYear.checked,
          color: INK,
          outputSize: Number(document.querySelector('input[name="output-size"]:checked').value)
        };
      }

      function validateStampConfig(config) {
        if (graphemeLength(config.topName) > MAX_NAME_LENGTH) {
          return { valid: false, field: "topName", message: "上段は4文字以内で入力してください。" };
        }
        if (graphemeLength(config.bottomName) > MAX_NAME_LENGTH) {
          return { valid: false, field: "bottomName", message: "下段は4文字以内で入力してください。" };
        }
        const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(config.date);
        if (!match) {
          return { valid: false, field: "date", message: "日付を入力してください。" };
        }
        const year = Number(match[1]);
        const month = Number(match[2]);
        const day = Number(match[3]);
        const candidate = new Date(year, month - 1, day);
        if (candidate.getFullYear() !== year || candidate.getMonth() !== month - 1 || candidate.getDate() !== day) {
          return { valid: false, field: "date", message: "有効な日付を入力してください。" };
        }
        return { valid: true, field: null, message: "" };
      }

      function escapeXml(value) {
        return value
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&apos;");
      }

      function concatBytes(...parts) {
        const totalLength = parts.reduce((sum, part) => sum + part.length, 0);
        const result = new Uint8Array(totalLength);
        let offset = 0;
        for (const part of parts) {
          result.set(part, offset);
          offset += part.length;
        }
        return result;
      }

      function uint32Bytes(value) {
        const bytes = new Uint8Array(4);
        new DataView(bytes.buffer).setUint32(0, value >>> 0);
        return bytes;
      }

      function uint16Bytes(value) {
        const bytes = new Uint8Array(2);
        new DataView(bytes.buffer).setUint16(0, value);
        return bytes;
      }

      function crc32(bytes) {
        let crc = 0xffffffff;
        for (const byte of bytes) {
          crc ^= byte;
          for (let bit = 0; bit < 8; bit += 1) {
            crc = (crc >>> 1) ^ (0xedb88320 & -(crc & 1));
          }
        }
        return (crc ^ 0xffffffff) >>> 0;
      }

      function createPngChunk(type, data) {
        const typeBytes = textEncoder.encode(type);
        const crcInput = concatBytes(typeBytes, data);
        return concatBytes(
          uint32Bytes(data.length),
          typeBytes,
          data,
          uint32Bytes(crc32(crcInput))
        );
      }

      function hasPngSignature(bytes) {
        return bytes.length >= PNG_SIGNATURE.length
          && PNG_SIGNATURE.every((byte, index) => bytes[index] === byte);
      }

      function parsePngChunks(bytes, validateCrc = true) {
        if (!hasPngSignature(bytes)) throw new Error("PNG形式ではありません。");
        const chunks = [];
        let offset = PNG_SIGNATURE.length;
        while (offset < bytes.length) {
          if (offset + 12 > bytes.length) throw new Error("PNGデータが途中で切れています。");
          const length = new DataView(bytes.buffer, bytes.byteOffset + offset, 4).getUint32(0);
          const end = offset + 12 + length;
          if (end > bytes.length) throw new Error("PNGチャンクの長さが不正です。");
          const typeBytes = bytes.slice(offset + 4, offset + 8);
          const type = new TextDecoder("ascii").decode(typeBytes);
          const data = bytes.slice(offset + 8, offset + 8 + length);
          const expectedCrc = new DataView(bytes.buffer, bytes.byteOffset + offset + 8 + length, 4).getUint32(0);
          if (validateCrc && crc32(concatBytes(typeBytes, data)) !== expectedCrc) {
            throw new Error("PNGチャンクの検査値が一致しません。");
          }
          chunks.push({ type, data, offset, end, raw: bytes.slice(offset, end) });
          offset = end;
          if (type === "IEND") {
            if (offset !== bytes.length) throw new Error("PNG終端後に不正なデータがあります。");
            break;
          }
        }
        if (chunks.at(-1)?.type !== "IEND") throw new Error("PNG終端がありません。");
        return chunks;
      }

      async function sha256Hex(bytes) {
        if (!window.crypto?.subtle) throw new Error("画像を生成できません。");
        const digest = new Uint8Array(await window.crypto.subtle.digest("SHA-256", bytes));
        return Array.from(digest, (byte) => byte.toString(16).padStart(2, "0")).join("");
      }

      function createRecordId() {
        if (typeof window.crypto.randomUUID === "function") return window.crypto.randomUUID();
        const bytes = window.crypto.getRandomValues(new Uint8Array(16));
        bytes[6] = (bytes[6] & 0x0f) | 0x40;
        bytes[8] = (bytes[8] & 0x3f) | 0x80;
        const hex = Array.from(bytes, (byte) => byte.toString(16).padStart(2, "0")).join("");
        return `${hex.slice(0, 8)}-${hex.slice(8, 12)}-${hex.slice(12, 16)}-${hex.slice(16, 20)}-${hex.slice(20)}`;
      }

      function createProvenanceRecord(config, identity, format, scope, digestValue) {
        return {
          schema: PROVENANCE_SCHEMA,
          version: PROVENANCE_VERSION,
          issuerId: PROVENANCE_ISSUER_ID,
          recordId: identity.recordId,
          createdAt: identity.createdAt,
          format,
          stamp: {
            topName: config.topName,
            bottomName: config.bottomName,
            date: config.date,
            shortYear: config.shortYear,
            color: config.color,
            outputSize: config.outputSize
          },
          digest: {
            algorithm: "SHA-256",
            scope,
            value: digestValue
          }
        };
      }

      async function embedSvgProvenance(svg, config, identity) {
        const digestValue = await sha256Hex(textEncoder.encode(svg));
        const record = createProvenanceRecord(config, identity, "svg", "svg-without-provenance", digestValue);
        const insertAt = svg.indexOf("\n") + 1;
        if (insertAt === 0) throw new Error("SVGの形式が不正です。");
        const metadata = `  <metadata id="date-stamp-provenance">${escapeXml(JSON.stringify(record))}</metadata>\n`;
        return `${svg.slice(0, insertAt)}${metadata}${svg.slice(insertAt)}`;
      }

      function canvasToPngBlob(canvas) {
        return new Promise((resolve, reject) => {
          canvas.toBlob((blob) => {
            if (blob) resolve(blob);
            else reject(new Error("PNGの生成に失敗しました。"));
          }, "image/png");
        });
      }

      function writePixelPacket(imageData, packet) {
        const carrierOffsets = [];
        for (let offset = 0; offset < imageData.data.length; offset += 4) {
          const red = imageData.data[offset];
          const green = imageData.data[offset + 1];
          const blue = imageData.data[offset + 2];
          const alpha = imageData.data[offset + 3];
          if (alpha >= 250 && red >= 128 && green <= 64 && blue <= 64) {
            carrierOffsets.push(offset + 2);
          }
        }
        const requiredBits = packet.length * 8;
        if (carrierOffsets.length < requiredBits) throw new Error("画像に記録情報を格納できません。");
        for (let bitIndex = 0; bitIndex < requiredBits; bitIndex += 1) {
          const byte = packet[Math.floor(bitIndex / 8)];
          const bit = (byte >>> (7 - (bitIndex % 8))) & 1;
          const blueOffset = carrierOffsets[bitIndex];
          imageData.data[blueOffset] = (imageData.data[blueOffset] & 0xfe) | bit;
        }
      }

      function getCarrierOffsets(imageData) {
        const offsets = [];
        for (let offset = 0; offset < imageData.data.length; offset += 4) {
          const red = imageData.data[offset];
          const green = imageData.data[offset + 1];
          const blue = imageData.data[offset + 2];
          const alpha = imageData.data[offset + 3];
          if (alpha >= 250 && red >= 128 && green <= 64 && blue <= 64) offsets.push(offset + 2);
        }
        return offsets;
      }

      function readCarrierBytes(imageData, carrierOffsets, byteCount) {
        if (carrierOffsets.length < byteCount * 8) return null;
        const bytes = new Uint8Array(byteCount);
        for (let byteIndex = 0; byteIndex < byteCount; byteIndex += 1) {
          let value = 0;
          for (let bitIndex = 0; bitIndex < 8; bitIndex += 1) {
            const carrierIndex = byteIndex * 8 + bitIndex;
            value = (value << 1) | (imageData.data[carrierOffsets[carrierIndex]] & 1);
          }
          bytes[byteIndex] = value;
        }
        return bytes;
      }

      async function blobToImageData(blob) {
        const image = await createImageBitmap(blob);
        if (image.width > MAX_VERIFY_PNG_DIMENSION
            || image.height > MAX_VERIFY_PNG_DIMENSION
            || image.width * image.height > MAX_VERIFY_PNG_PIXELS) {
          image.close();
          throw new Error("画像の寸法が大きすぎます。");
        }
        const canvas = document.createElement("canvas");
        canvas.width = image.width;
        canvas.height = image.height;
        const context = canvas.getContext("2d", { alpha: true, willReadFrequently: true });
        context.drawImage(image, 0, 0);
        image.close();
        return context.getImageData(0, 0, canvas.width, canvas.height);
      }

      function decodeITxt(data) {
        const keywordEnd = data.indexOf(0);
        if (keywordEnd < 1 || keywordEnd + 5 > data.length) throw new Error("PNGテキストチャンクが不正です。");
        const keyword = textDecoder.decode(data.slice(0, keywordEnd));
        let position = keywordEnd + 1;
        const compressionFlag = data[position];
        const compressionMethod = data[position + 1];
        position += 2;
        const languageEnd = data.indexOf(0, position);
        if (languageEnd < 0) throw new Error("PNG言語情報が不正です。");
        position = languageEnd + 1;
        const translatedEnd = data.indexOf(0, position);
        if (translatedEnd < 0) throw new Error("PNG翻訳情報が不正です。");
        position = translatedEnd + 1;
        if (compressionFlag !== 0 || compressionMethod !== 0) throw new Error("PNG記録情報の圧縮形式に対応していません。");
        const textBytes = data.slice(position);
        if (textBytes.length > MAX_PROVENANCE_BYTES) throw new Error("PNG記録情報が大きすぎます。");
        return { keyword, text: strictTextDecoder.decode(textBytes) };
      }

      function extractPngTextRecord(bytes) {
        const records = [];
        for (const chunk of parsePngChunks(bytes)) {
          if (chunk.type !== "iTXt") continue;
          const keywordEnd = chunk.data.indexOf(0);
          if (keywordEnd < 1) continue;
          const keyword = textDecoder.decode(chunk.data.slice(0, keywordEnd));
          if (keyword !== PROVENANCE_KEYWORD) continue;
          const decoded = decodeITxt(chunk.data);
          records.push(JSON.parse(decoded.text));
        }
        if (records.length > 1) throw new Error("PNG記録情報が重複しています。");
        return records[0] ?? null;
      }

      function hasMagic(bytes, magic) {
        return bytes && magic.every((byte, index) => bytes[index] === byte);
      }

      async function extractPixelRecord(imageData) {
        const carrierOffsets = getCarrierOffsets(imageData);
        const header = readCarrierBytes(imageData, carrierOffsets, 6);
        if (!hasMagic(header, PIXEL_WATERMARK_MAGIC)) return null;
        const payloadLength = new DataView(header.buffer, header.byteOffset + 4, 2).getUint16(0);
        if (payloadLength > MAX_PROVENANCE_BYTES) throw new Error("画像内の記録情報が大きすぎます。");
        const packet = readCarrierBytes(imageData, carrierOffsets, 6 + payloadLength + 4);
        if (!packet) throw new Error("画像内の記録情報が途中で切れています。");
        const payload = packet.slice(6, 6 + payloadLength);
        const expectedCrc = new DataView(packet.buffer, packet.byteOffset + 6 + payloadLength, 4).getUint32(0);
        if (crc32(payload) !== expectedCrc) throw new Error("画像内の記録情報が破損しています。");
        const record = JSON.parse(strictTextDecoder.decode(payload));
        const canonicalRgba = new Uint8Array(imageData.data);
        for (const offset of carrierOffsets) canonicalRgba[offset] &= 0xfe;
        return { record, digestValue: await sha256Hex(canonicalRgba) };
      }

      function validatePngDimensions(bytes) {
        const chunks = parsePngChunks(bytes);
        const ihdr = chunks[0];
        if (ihdr?.type !== "IHDR" || ihdr.data.length !== 13) throw new Error("PNGヘッダーが不正です。");
        const view = new DataView(ihdr.data.buffer, ihdr.data.byteOffset, ihdr.data.byteLength);
        const width = view.getUint32(0);
        const height = view.getUint32(4);
        if (width === 0 || height === 0
            || width > MAX_VERIFY_PNG_DIMENSION
            || height > MAX_VERIFY_PNG_DIMENSION
            || width * height > MAX_VERIFY_PNG_PIXELS) {
          throw new Error("画像の寸法が大きすぎます。");
        }
      }

      function isValidRecord(record, expectedFormat) {
        if (!record || typeof record !== "object" || Array.isArray(record)) return false;
        if (record.schema !== PROVENANCE_SCHEMA || record.version !== PROVENANCE_VERSION) return false;
        if (record.issuerId !== PROVENANCE_ISSUER_ID || record.format !== expectedFormat) return false;
        if (typeof record.recordId !== "string" || !/^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(record.recordId)) return false;
        if (typeof record.createdAt !== "string" || !Number.isFinite(Date.parse(record.createdAt))) return false;
        if (!record.stamp || typeof record.stamp !== "object" || Array.isArray(record.stamp)) return false;
        if (typeof record.stamp.topName !== "string" || typeof record.stamp.bottomName !== "string") return false;
        if (typeof record.stamp.date !== "string" || typeof record.stamp.shortYear !== "boolean") return false;
        if (record.stamp.color !== INK || ![256, 512, 1024].includes(record.stamp.outputSize)) return false;
        if (!record.digest || record.digest.algorithm !== "SHA-256") return false;
        return typeof record.digest.value === "string" && /^[0-9a-f]{64}$/.test(record.digest.value);
      }

      async function verifyPng(file, bytes) {
        validatePngDimensions(bytes);
        const imageData = await blobToImageData(file);
        const pixelResult = await extractPixelRecord(imageData);
        if (!pixelResult || !isValidRecord(pixelResult.record, "png")) return { state: "unverified", record: null };
        const metadataRecord = extractPngTextRecord(bytes);
        const metadataMatches = metadataRecord === null
          || JSON.stringify(metadataRecord) === JSON.stringify(pixelResult.record);
        const digestMatches = pixelResult.record.digest.scope === "rgba-blue-lsb-cleared"
          && pixelResult.record.digest.value === pixelResult.digestValue;
        return {
          state: metadataMatches && digestMatches ? "verified" : "modified",
          record: pixelResult.record
        };
      }

      function extractSvgRecord(svg, parsed) {
        const startToken = '  <metadata id="date-stamp-provenance">';
        const endToken = "</metadata>\n";
        const start = svg.indexOf(startToken);
        if (start < 0) return null;
        if (svg.indexOf(startToken, start + startToken.length) >= 0) throw new Error("SVG記録情報が重複しています。");
        const endStart = svg.indexOf(endToken, start + startToken.length);
        if (endStart < 0) throw new Error("SVG記録情報が途中で切れています。");
        const metadataElements = parsed.querySelectorAll("metadata#date-stamp-provenance");
        if (metadataElements.length !== 1) throw new Error("SVG記録情報が不正です。");
        const record = JSON.parse(metadataElements[0].textContent);
        const end = endStart + endToken.length;
        return { record, svgWithoutProvenance: `${svg.slice(0, start)}${svg.slice(end)}` };
      }

      async function verifySvg(svg) {
        const parsed = new DOMParser().parseFromString(svg, "image/svg+xml");
        if (parsed.querySelector("parsererror") || parsed.documentElement.localName !== "svg") {
          throw new Error("SVG形式が不正です。");
        }
        const extracted = extractSvgRecord(svg, parsed);
        if (!extracted || !isValidRecord(extracted.record, "svg")) return { state: "unverified", record: null };
        const digestValue = await sha256Hex(textEncoder.encode(extracted.svgWithoutProvenance));
        const matches = extracted.record.digest.scope === "svg-without-provenance"
          && extracted.record.digest.value === digestValue;
        return { state: matches ? "verified" : "modified", record: extracted.record };
      }

      async function verifyArtifact(file) {
        if (!file || file.size === 0) throw new Error("画像ファイルを選択してください。");
        if (file.size > MAX_VERIFY_FILE_SIZE) throw new Error("20MB以下の画像を選択してください。");
        const bytes = new Uint8Array(await file.arrayBuffer());
        if (hasPngSignature(bytes)) return verifyPng(file, bytes);
        if (file.size > MAX_VERIFY_SVG_SIZE) throw new Error("SVGは2MB以下のものを選択してください。");
        let text;
        try {
          text = strictTextDecoder.decode(bytes);
        } catch {
          throw new Error("PNGまたはSVGを選択してください。");
        }
        return verifySvg(text);
      }

      function setVerifyStatus(message, state) {
        elements.verifyStatus.textContent = message;
        elements.verifyStatus.dataset.state = state;
      }

      function addVerificationDetail(label, value) {
        const term = document.createElement("dt");
        const detail = document.createElement("dd");
        term.textContent = label;
        detail.textContent = value;
        elements.verifyDetails.append(term, detail);
      }

      function renderVerificationResult(result) {
        elements.verifyDetails.replaceChildren();
        if (result.state === "verified") setVerifyStatus("来歴情報と画像内容が一致しています。", "verified");
        else if (result.state === "modified") setVerifyStatus("画像内容が記録時から変更されています。", "modified");
        else setVerifyStatus("この画像の来歴情報は確認できません。再保存などで情報が失われた可能性があります。", "unverified");
        if (!result.record) return;
        const record = result.record;
        addVerificationDetail("形式", record.format.toUpperCase());
        addVerificationDetail("記録日時", new Date(record.createdAt).toLocaleString("ja-JP"));
        addVerificationDetail("発行元ID", record.issuerId);
        addVerificationDetail("記録ID", record.recordId);
        addVerificationDetail("印面日付", record.stamp.date);
        addVerificationDetail("上段", record.stamp.topName || "空欄");
        addVerificationDetail("下段", record.stamp.bottomName || "空欄");
      }

      function configureVerificationMode() {
        elements.verifier.hidden = location.hash !== "#verify-provenance";
      }

      async function embedPngProvenance(blob, config, identity) {
        const image = await createImageBitmap(blob);
        const canvas = document.createElement("canvas");
        canvas.width = image.width;
        canvas.height = image.height;
        const context = canvas.getContext("2d", { alpha: true, willReadFrequently: true });
        context.drawImage(image, 0, 0);
        image.close();
        const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
        const canonicalRgba = new Uint8Array(imageData.data);
        for (const offset of getCarrierOffsets(imageData)) canonicalRgba[offset] &= 0xfe;
        const digestValue = await sha256Hex(canonicalRgba);
        const record = createProvenanceRecord(config, identity, "png", "rgba-blue-lsb-cleared", digestValue);
        const jsonBytes = textEncoder.encode(JSON.stringify(record));
        if (jsonBytes.length > MAX_PROVENANCE_BYTES) throw new Error("画像の記録情報が大きすぎます。");
        const packet = concatBytes(
          PIXEL_WATERMARK_MAGIC,
          uint16Bytes(jsonBytes.length),
          jsonBytes,
          uint32Bytes(crc32(jsonBytes))
        );
        writePixelPacket(imageData, packet);
        context.putImageData(imageData, 0, 0);
        const watermarkedBlob = await canvasToPngBlob(canvas);
        const bytes = new Uint8Array(await watermarkedBlob.arrayBuffer());
        const chunks = parsePngChunks(bytes);
        const iend = chunks.at(-1);
        const keywordBytes = textEncoder.encode(PROVENANCE_KEYWORD);
        const iTxtData = concatBytes(
          keywordBytes,
          new Uint8Array([0, 0, 0, 0, 0]),
          jsonBytes
        );
        const iTxtChunk = createPngChunk("iTXt", iTxtData);
        const annotated = concatBytes(bytes.slice(0, iend.offset), iTxtChunk, bytes.slice(iend.offset));
        return new Blob([annotated], { type: "image/png" });
      }

      function formatDate(value, shortYear) {
        const [year, month, day] = value.split("-");
        return shortYear
          ? `'${year.slice(-2)}.${month}.${day}`
          : `${year}.${month}.${day}`;
      }

      function calculateFontSize(text, maxWidth, maximum, minimum, fontFamily) {
        if (!text) return maximum;
        let low = minimum;
        let high = maximum;
        while (high - low > 1) {
          const middle = Math.floor((low + high) / 2);
          measureContext.font = `600 ${middle}px ${fontFamily}`;
          if (measureContext.measureText(text).width <= maxWidth) {
            low = middle;
          } else {
            high = middle;
          }
        }
        return low;
      }

      function buildStampSvg(config) {
        const dateText = formatDate(config.date, config.shortYear);
        const topSize = calculateFontSize(config.topName, 680, 230, 92, NAME_FONT_FAMILY);
        const bottomSize = calculateFontSize(config.bottomName, 680, 230, 92, NAME_FONT_FAMILY);
        const dateSize = calculateFontSize(dateText, 760, config.shortYear ? 165 : 145, 96, DATE_FONT_FAMILY);
        const safeTop = escapeXml(config.topName);
        const safeBottom = escapeXml(config.bottomName);
        const safeDate = escapeXml(dateText);
        return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-label="日付印">
  <defs>
    <clipPath id="stamp-clip"><circle cx="500" cy="500" r="440"/></clipPath>
  </defs>
  <g fill="none" stroke="${config.color}" stroke-width="30" stroke-linecap="butt" stroke-linejoin="round">
    <circle cx="500" cy="500" r="440"/>
    <g clip-path="url(#stamp-clip)">
      <line class="divider" x1="35" y1="355" x2="965" y2="355"/>
      <line class="divider" x1="35" y1="645" x2="965" y2="645"/>
    </g>
  </g>
  <g fill="${config.color}" font-weight="600" text-anchor="middle" dominant-baseline="central">
    <text id="top-text" x="500" y="208" font-family="${NAME_FONT_FAMILY}" font-size="${topSize}">${safeTop}</text>
    <text id="date-text" x="500" y="500" font-family="${DATE_FONT_FAMILY}" font-size="${dateSize}">${safeDate}</text>
    <text id="bottom-text" x="500" y="792" font-family="${NAME_FONT_FAMILY}" font-size="${bottomSize}">${safeBottom}</text>
  </g>
</svg>`;
      }

      function renderPreview(svg) {
        const parsed = new DOMParser().parseFromString(svg, "image/svg+xml");
        const error = parsed.querySelector("parsererror");
        if (error) throw new Error("SVGの生成に失敗しました。");
        elements.preview.replaceChildren(document.importNode(parsed.documentElement, true));
      }

      function renderPngBlob(svg, size) {
        return new Promise((resolve, reject) => {
          const svgBlob = new Blob([svg], { type: "image/svg+xml;charset=utf-8" });
          const url = URL.createObjectURL(svgBlob);
          const image = new Image();
          image.onload = () => {
            try {
              const canvas = document.createElement("canvas");
              canvas.width = size;
              canvas.height = size;
              const context = canvas.getContext("2d", { alpha: true });
              context.clearRect(0, 0, size, size);
              context.drawImage(image, 0, 0, size, size);
              canvas.toBlob((blob) => {
                URL.revokeObjectURL(url);
                if (blob) resolve(blob);
                else reject(new Error("PNGの生成に失敗しました。"));
              }, "image/png");
            } catch (error) {
              URL.revokeObjectURL(url);
              reject(error);
            }
          };
          image.onerror = () => {
            URL.revokeObjectURL(url);
            reject(new Error("印影画像を読み込めませんでした。"));
          };
          image.src = url;
        });
      }

      function setButtonsDisabled(disabled) {
        elements.copyPng.disabled = disabled;
        elements.downloadPng.disabled = disabled;
        elements.downloadSvg.disabled = disabled;
      }

      function setStatus(message, state) {
        elements.status.textContent = message;
        elements.status.dataset.state = state;
      }

      function updateInputValidity(invalidField = null) {
        elements.topName.setAttribute("aria-invalid", String(invalidField === "topName"));
        elements.bottomName.setAttribute("aria-invalid", String(invalidField === "bottomName"));
        elements.date.setAttribute("aria-invalid", String(invalidField === "date"));
        elements.topName.setAttribute("aria-describedby", invalidField === "topName" ? "name-help status" : "name-help");
        elements.bottomName.setAttribute("aria-describedby", invalidField === "bottomName" ? "name-help status" : "name-help");
        if (invalidField === "date") elements.date.setAttribute("aria-describedby", "status");
        else elements.date.removeAttribute("aria-describedby");
      }

      async function refreshOutput() {
        const generation = ++renderGeneration;
        const config = readStampConfig();
        const validation = validateStampConfig(config);
        updateInputValidity(validation.field);
        currentPngBlob = null;
        currentConfig = null;
        if (!validation.valid) {
          currentSvg = "";
          elements.preview.replaceChildren();
          setButtonsDisabled(true);
          setStatus(validation.message, "error");
          return;
        }

        try {
          setButtonsDisabled(true);
          setStatus("画像を準備しています。", "working");
          const identity = { recordId: createRecordId(), createdAt: new Date().toISOString() };
          const visualSvg = buildStampSvg(config);
          const annotatedSvg = await embedSvgProvenance(visualSvg, config, identity);
          if (generation !== renderGeneration) return;
          currentSvg = annotatedSvg;
          currentConfig = config;
          renderPreview(currentSvg);
          elements.downloadSvg.disabled = false;
          if (document.fonts && document.fonts.ready) await document.fonts.ready;
          const rawPngBlob = await renderPngBlob(currentSvg, config.outputSize);
          const pngBlob = await embedPngProvenance(rawPngBlob, config, identity);
          if (generation !== renderGeneration) return;
          currentPngBlob = pngBlob;
          setButtonsDisabled(false);
          setStatus("コピーまたは保存できます。", "ready");
        } catch (error) {
          if (generation !== renderGeneration) return;
          currentPngBlob = null;
          elements.copyPng.disabled = true;
          elements.downloadPng.disabled = true;
          setStatus(error instanceof Error ? error.message : "画像の生成に失敗しました。", "error");
        }
      }

      function fileStem(config) {
        return `日付印_${config.date.replaceAll("-", "")}`;
      }

      function downloadBlob(blob, filename) {
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = filename;
        document.body.append(link);
        link.click();
        link.remove();
        window.setTimeout(() => URL.revokeObjectURL(url), 0);
      }

      async function copyPng(blob) {
        if (!window.isSecureContext || !navigator.clipboard?.write || !window.ClipboardItem) {
          return { ok: false, reason: "unsupported" };
        }
        try {
          await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]);
          return { ok: true, reason: "" };
        } catch (error) {
          return { ok: false, reason: error instanceof Error ? error.name : "failed" };
        }
      }

      elements.copyPng.addEventListener("click", async () => {
        if (!currentPngBlob) return;
        const result = await copyPng(currentPngBlob);
        if (result.ok) {
          setStatus("透過PNGをクリップボードへコピーしました。", "success");
        } else {
          setStatus("このブラウザでは直接コピーできません。「PNGを保存」を使ってください。", "error");
        }
      });

      elements.downloadPng.addEventListener("click", () => {
        if (!currentPngBlob || !currentConfig) return;
        downloadBlob(currentPngBlob, `${fileStem(currentConfig)}.png`);
        setStatus("透過PNGを保存しました。", "success");
      });

      elements.downloadSvg.addEventListener("click", () => {
        if (!currentSvg || !currentConfig) return;
        const blob = new Blob([currentSvg], { type: "image/svg+xml;charset=utf-8" });
        downloadBlob(blob, `${fileStem(currentConfig)}.svg`);
        setStatus("SVGを保存しました。", "success");
      });

      elements.verifyFile.addEventListener("change", async () => {
        const generation = ++verificationGeneration;
        const file = elements.verifyFile.files?.[0];
        elements.verifyDetails.replaceChildren();
        setVerifyStatus("画像を確認しています。", "working");
        try {
          const result = await verifyArtifact(file);
          if (generation !== verificationGeneration) return;
          renderVerificationResult(result);
        } catch (error) {
          if (generation !== verificationGeneration) return;
          setVerifyStatus(error instanceof Error ? error.message : "画像を確認できませんでした。", "error");
        }
      });

      window.addEventListener("hashchange", configureVerificationMode);

      for (const input of [elements.topName, elements.bottomName, elements.date, elements.shortYear, ...elements.outputSizes]) {
        input.addEventListener("input", refreshOutput);
      }

      elements.date.value = getLocalDateValue();
      configureVerificationMode();
      refreshOutput();
    })();
  </script>
</body>
</html>
